[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgov"
version = "0.1.0"
description = "Python SDK for agentgov governance proxy — budget enforcement, HITL approval, and error classification"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-httpx>=0.21.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
