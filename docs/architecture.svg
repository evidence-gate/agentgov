<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agentgov architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Background (deep violet — agentgov purple) -->
  <rect width="800" height="420" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="36" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="rgba(167,139,250,0.7)" text-anchor="middle" letter-spacing="0.1em">AGENTGOV ARCHITECTURE</text>

  <!-- Layer 1: Your Application -->
  <rect x="20" y="56" width="760" height="72" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="44" y="82" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.9)">Your</text>
  <text x="44" y="100" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.9)">Application</text>
  <rect x="160" y="66" width="260" height="52" rx="8" fill="white"/>
  <text x="290" y="89" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Agent Code</text>
  <text x="290" y="106" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Any framework — LangChain, AutoGPT, custom</text>
  <rect x="440" y="66" width="160" height="52" rx="8" fill="white"/>
  <text x="520" y="89" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">OpenAI SDK</text>
  <text x="520" y="106" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Standard API client</text>
  <rect x="620" y="66" width="148" height="52" rx="8" fill="white"/>
  <text x="694" y="89" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Anthropic SDK</text>
  <text x="694" y="106" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Standard API client</text>

  <!-- Arrow 1 -->
  <text x="400" y="148" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">▼  agentgov.wrap(client)  — one line integration  ▼</text>

  <!-- Layer 2: agentgov Proxy (highlighted with brand purple) -->
  <rect x="20" y="162" width="760" height="102" rx="12" fill="rgba(124,58,237,0.2)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
  <text x="44" y="194" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#c4b5fd">agentgov</text>
  <text x="44" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#c4b5fd">Proxy</text>
  <text x="44" y="232" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="rgba(196,181,253,0.5)">Hono + Cloudflare</text>

  <rect x="160" y="175" width="145" height="76" rx="8" fill="white"/>
  <text x="232" y="200" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Budget Gate</text>
  <text x="232" y="216" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Hold / Settle pattern</text>
  <text x="232" y="232" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Pre-authorize cost</text>

  <rect x="318" y="175" width="145" height="76" rx="8" fill="white"/>
  <text x="390" y="200" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">HITL Approval</text>
  <text x="390" y="216" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Risk-graded actions</text>
  <text x="390" y="232" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Slack / webhook</text>

  <rect x="476" y="175" width="145" height="76" rx="8" fill="white"/>
  <text x="548" y="200" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Loop Detector</text>
  <text x="548" y="216" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fingerprint matching</text>
  <text x="548" y="232" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Auto-halt stuck agents</text>

  <rect x="634" y="175" width="134" height="76" rx="8" fill="white"/>
  <text x="701" y="200" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Audit Log</text>
  <text x="701" y="216" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">SHA-256 chain</text>
  <text x="701" y="232" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Tamper-evident</text>

  <!-- Arrow 2 -->
  <text x="400" y="286" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">▼  governed API call  ▼</text>

  <!-- Layer 3: LLM Providers -->
  <rect x="20" y="300" width="760" height="72" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="44" y="326" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.9)">LLM</text>
  <text x="44" y="344" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.9)">Providers</text>
  <rect x="160" y="310" width="190" height="52" rx="8" fill="white"/>
  <text x="255" y="333" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">OpenAI</text>
  <text x="255" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">GPT-4o, GPT-4.1, o3</text>
  <rect x="366" y="310" width="190" height="52" rx="8" fill="white"/>
  <text x="461" y="333" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Anthropic</text>
  <text x="461" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Claude 4, Sonnet, Haiku</text>
  <rect x="572" y="310" width="196" height="52" rx="8" fill="white"/>
  <text x="670" y="333" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Google</text>
  <text x="670" y="350" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Gemini 2.5 Pro / Flash</text>

  <!-- Footer -->
  <text x="400" y="400" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">Rule-based enforcement — no LLM-based guardrails</text>
</svg>
